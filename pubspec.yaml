name: metjou
description: MetJou - shake-to-alert personal safety app.
publish_to: 'none'
version: 2.0.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  animations: ^3.0.0
  another_telephony: ^0.4.1
  audio_background_record:
    path: ./plugins/audio_background_record
  carousel_slider: ^5.1.2
  flutter_local_notifications: ^22.3.1
  flutter_markdown_plus: ^1.0.12
  flutter_native_contact_picker: ^0.0.12
  flutter_phone_direct_caller: ^2.2.1
  flutter_slidable: ^4.0.3
  flutter_spinkit: ^5.2.2
  fluttertoast: ^10.0.0
  geolocator: ^14.0.3
  lottie: ^3.6.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pinput: ^6.0.2
  shake: ^3.0.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  vibration: ^3.2.1
  workmanager: ^0.10.10
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/legal/
    - assets/onboarding/
    - assets/resources/

  fonts:
    # Readex Pro (SIL OFL 1.1, see assets/fonts/OFL.txt), subset to Latin
    # and Arabic.
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
