org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m
kotlin.daemon.jvmargs=-Xmx1g
# The daemon is only needed while Gradle builds. By default it stays for
# three hours afterwards and keeps about 1.5 GB; here it leaves after two
# minutes, so a `flutter run` session gets that memory back.
org.gradle.daemon.idletimeout=120000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# another_telephony compiles Java 11 / Kotlin 1.8; do not fail the build on it.
kotlin.jvm.target.validation.mode=warning
